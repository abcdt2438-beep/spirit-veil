<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VEIL CIRCLE · Channel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="veil">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="fx"></canvas>
    <div class="mist a"></div>
    <div class="mist b"></div>
    <div class="vignette"></div>
    <div class="scan"></div>
    <div class="orbs" id="orbs"></div>
    <div class="apparition" id="apparition"></div>
    <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="r1" cx="100" cy="100" r="92" />
      <circle class="r2" cx="100" cy="100" r="78" />
      <circle class="r3" cx="100" cy="100" r="64" />
      <path class="marks" d="M100 8 L100 22 M192 100 L178 100 M100 192 L100 178 M8 100 L22 100 M164 36 L154 46 M36 36 L46 46 M164 164 L154 154 M36 164 L46 154" />
    </svg>
    <header class="top">
      <div class="sigil" id="sigil">◯</div>
      <div>
        <div class="brand">VEIL CIRCLE</div>
        <div class="sub" id="status">threshold sealed</div>
      </div>
      <button id="camBtn" class="ghost">open the eye</button>
    </header>
    <div class="presence">
      <span>presence</span>
      <div class="bar"><i id="pbar"></i></div>
      <span id="pname">silent</span>
    </div>
    <main class="chat" id="chat"></main>
    <form id="form" class="dock">
      <select id="spirit">
        <option value="veil">The Veil</option>
        <option value="threshold">Threshold Keeper</option>
        <option value="ash">Ash Voice</option>
        <option value="bone">Bone Echo</option>
        <option value="rust">Rust Saint</option>
      </select>
      <input id="msg" type="text" autocomplete="off" placeholder="speak across the veil…" maxlength="280" />
      <button type="submit">channel</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
